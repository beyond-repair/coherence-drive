[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-drive"
version = "0.1.0"
description = "Claim-0 Coherence Drive research index and discovery ledger. Not a propulsion engine; not thrust."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brian Ware" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coherence-drive = "coherence_drive.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coherence_drive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
